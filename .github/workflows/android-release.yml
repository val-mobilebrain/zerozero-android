name: Android Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  assemble-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0

      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > "${{ github.workspace }}/release.keystore"
          keytool -list -keystore "${{ github.workspace }}/release.keystore" \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew clean assembleRelease --no-configuration-cache --stacktrace

      - name: Verify signed APK
        run: |
          set -euo pipefail
          APK="${{ github.workspace }}/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "Expected signed app-release.apk was not produced (check signing secrets)."
            ls -la "${{ github.workspace }}/app/build/outputs/apk/release/" || true
            exit 1
          fi
          if [ -f "${{ github.workspace }}/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            echo "Unsigned APK present — release signing did not apply."
            exit 1
          fi
          apksigner verify --verbose "$APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: zerozero-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
