name: Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0

      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          KEYSTORE_PATH="${{ github.workspace }}/release.keystore"
          echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > "$KEYSTORE_PATH"
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "Decoded keystore is empty. Paste full KEYSTORE_BASE64 (one line from release.keystore.base64.txt)."
            exit 1
          fi
          keytool -list -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Build signed release AAB (API 36)
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
        run: ./gradlew clean bundleRelease --no-configuration-cache --stacktrace

      - name: Verify signed AAB
        run: |
          set -euo pipefail
          AAB="${{ github.workspace }}/app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB" ]; then
            echo "Expected signed app-release.aab was not produced."
            ls -la "${{ github.workspace }}/app/build/outputs/bundle/release/" || true
            exit 1
          fi
          jarsigner -verify -verbose -certs "$AAB" | head -20

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: zerozero-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
